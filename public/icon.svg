<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Construction Hardhat & Building Symbol Group -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Base building silhouette behind helmet -->
    <path d="M-110,60 L-110,-40 L-60,-40 L-60,-90 L0,-90 L0,-40 L60,-40 L60,-90 L110,-90 L110,60 Z" fill="#334155" opacity="0.5"/>
    <rect x="-90" y="-20" width="20" height="25" rx="3" fill="#64748b" opacity="0.7"/>
    <rect x="-40" y="-70" width="20" height="25" rx="3" fill="#64748b" opacity="0.7"/>
    <rect x="20" y="-20" width="20" height="25" rx="3" fill="#64748b" opacity="0.7"/>
    <rect x="75" y="-70" width="20" height="25" rx="3" fill="#64748b" opacity="0.7"/>

    <!-- Hardhat Brim Base -->
    <path d="M-150,70 C-150,55 -120,50 0,50 C120,50 150,55 150,70 C150,85 120,90 0,90 C-120,90 -150,85 -150,70 Z" fill="#d97706"/>
    <path d="M-135,68 C-135,58 -100,53 0,53 C100,53 135,58 135,68 C135,78 100,83 0,83 C-100,83 -135,78 -135,68 Z" fill="url(#goldGrad)"/>

    <!-- Hardhat Dome -->
    <path d="M-105,55 C-115,10 -105,-40 -65,-75 C-30,-105 30,-105 65,-75 C105,-40 115,10 105,55 Z" fill="url(#goldGrad)"/>
    
    <!-- Hardhat Center Crest/Ridge -->
    <path d="M-18,-85 C-18,-95 18,-95 18,-85 L14,52 L-14,52 Z" fill="#fbbf24"/>
    <path d="M-6,-88 C-6,-95 6,-95 6,-88 L4,52 L-4,52 Z" fill="#fef3c7" opacity="0.8"/>

    <!-- Modern Hammer & Wrench / Blueprint icon badge on hardhat -->
    <circle cx="0" cy="0" r="26" fill="#0f172a"/>
    <path d="M-12,-8 L-8,-12 L4,0 L12,-8 L15,-5 L3,7 L8,12 L5,15 L-7,3 L0,-4 Z" fill="#f59e0b"/>
  </g>

  <!-- Title Monogram / Text Hint -->
  <text x="256" y="440" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" letter-spacing="4" text-anchor="middle">
    MÃOS EM OBRA
  </text>
  <text x="256" y="470" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#f59e0b" letter-spacing="2" text-anchor="middle">
    CANTEIRO &amp; CUSTOS
  </text>
</svg>
